<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tribune">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>Tribune</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--live:#dc2626;--direct:#16a34a;--playin:#f59e0b}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#60a5fa;--live:#f87171;--direct:#4ade80;--playin:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 16px 40px;min-height:100vh}
header{padding:16px 0 4px}
h1{margin:0;font-size:28px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.nav button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--card);color:var(--text);font-size:14px}
.nav button.on{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
form{display:flex;gap:8px}
input,select{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;background:transparent;color:var(--text)}
button.add{border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;font-size:15px}
ul{list-style:none;padding:0;margin:8px 0 0}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #94a3b833}
li:last-child{border-bottom:0}
.del{border:0;background:none;color:var(--muted);font-size:22px;padding:0 4px}
.empty{color:var(--muted);font-size:14px;margin:8px 0 0}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.live{color:var(--live);font-weight:700;font-size:12px;margin-right:6px}
h2{font-size:17px;margin:0 0 6px}
h3.sub-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 0}
b{font-variant-numeric:tabular-nums}
.ver{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 4px);font-size:11px;color:var(--muted);opacity:.7}

/* Matchs : logos sur une ligne, noms (une ligne) puis rang en dessous */
.match{padding:12px 0;border-bottom:1px solid #94a3b833;text-align:center;cursor:pointer}
.match:last-child{border-bottom:0}
.row{display:flex;align-items:center;justify-content:center}
.side{width:130px;display:flex;justify-content:center;align-items:center;height:44px}
.side img{width:40px;height:40px;object-fit:contain}
.nm2{width:130px;font-size:12px;color:var(--muted);text-align:center;line-height:1.3;margin-top:4px}
.nm2 .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm2 .rk{white-space:nowrap}
.nm2.win .tn{color:var(--text);font-weight:700}
.mid{min-width:72px;padding:0 6px;font-size:14px;white-space:nowrap}
.mid b{font-size:17px}
.mid .sc{font-size:17px;font-weight:400}
.mid .sc.w{font-weight:800}

/* Classement */
.legend{font-size:12px;color:var(--muted);margin:6px 0 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}
.dot.direct{background:var(--direct)}
.dot.playin{background:var(--playin)}
details.conf{background:var(--bg);border-radius:12px;margin-top:10px;padding:0 12px}
details.conf summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none}
details.conf summary::-webkit-details-marker{display:none}
details.conf summary::after{content:"▾";float:right;color:var(--muted)}
details.conf[open] summary::after{content:"▴"}
details.conf ul{margin:0 0 8px}
li.st{padding:9px 8px;border-radius:10px;margin-top:4px;border-bottom:0}
li.st.direct{background:#16a34a22;box-shadow:inset 3px 0 0 var(--direct)}
li.st.playin{background:#f59e0b22;box-shadow:inset 3px 0 0 var(--playin)}
.rank{width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.nm{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.nm .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:24px;height:24px;object-fit:contain;flex:none}
select.filter{display:block;width:100%;margin:4px 0 8px}

/* Détail d'un match */
.back{border:0;background:none;color:var(--accent);font-size:15px;padding:0;margin-bottom:8px}
.big{font-size:24px}
table.qt{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.qt th,table.qt td{padding:8px 4px;text-align:center;border-bottom:1px solid #94a3b833}
table.qt th{text-align:left;font-weight:500;white-space:nowrap}
table.qt th.win{font-weight:700}
table.qt th img{width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:6px}
table.pl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.pl th,table.pl td{padding:6px 3px;text-align:right;border-bottom:1px solid #94a3b833;font-variant-numeric:tabular-nums}
table.pl th:first-child,table.pl td:first-child{text-align:left}
table.pl th{color:var(--muted);font-weight:500;font-size:11px}
table.pl td.pn{padding-left:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.bar{display:inline-block;width:4px;height:14px;border-radius:2px;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <h1>Tribune</h1>
  <div class="sub">Vos équipes et pilotes, suivis à votre façon</div>
</header>

<div class="nav" id="leagues"></div>
<div class="nav" id="tabs"></div>

<div id="app"></div>
<div class="ver">v1.14</div>

<script>
// Sources : API publiques ESPN (non officielles). Peuvent changer sans préavis.
const SCORES = "https://site.api.espn.com/apis/site/v2/sports/";
const STANDINGS = "https://site.api.espn.com/apis/v2/sports/";

// Version 1 : NBA seule. Pour ajouter un sport, décommentez ou copiez une ligne ci-dessous.
const LEAGUES = {
  "NBA": {path: "basketball/nba", startMonth: 9, ph: "ex. Boston Celtics"}
  // "Ligue 1": {path: "soccer/fra.1", startMonth: 7, ph: "ex. Paris Saint-Germain"},
  // "Top 14":  {path: "rugby/270557", startMonth: 7, ph: "ex. Stade Toulousain"},
  // "F1":      {path: "racing/f1", startMonth: 2, ph: "ex. Charles Leclerc"}
};
const TABS = [
  {key: "mine", label: "Mes matchs"},
  {key: "cal", label: "Calendrier"},
  {key: "results", label: "Résultats"},
  {key: "standings", label: "Classement"},
  {key: "favs", label: "Favoris"}
];

const REFRESH_LIVE = 60 * 1000;            // match en cours
const REFRESH_IDLE = 3 * 60 * 60 * 1000;   // le reste
const STANDINGS_TTL = 3 * 60 * 60 * 1000;

const state = { league: "NBA", tab: "mine", detail: null, teamFilter: "" };
let favs = loadFavs();
let token = 0;
let refreshTimer = null;
let liveNow = false;
let RANKS = new Map(); // nom d'équipe -> {seed, conf}
let TOP = new Set();   // équipes du top 6 de leur conférence
const TEAM_LOGOS = {}; // nom d'équipe -> URL du logo (mémorisé depuis les matchs)
const openConfs = new Set(); // conférences dépliées (conservées au rafraîchissement)

function loadFavs() {
  try { return JSON.parse(localStorage.getItem("tribune-favoris")) || {}; } catch (e) { return {}; }
}
function saveFavs() {
  try { localStorage.setItem("tribune-favoris", JSON.stringify(favs)); } catch (e) {}
}

const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function seasonStart(startMonth) {
  const now = new Date();
  const y = now.getMonth() >= startMonth ? now.getFullYear() : now.getFullYear() - 1;
  return new Date(y, startMonth, 1);
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// Logo d'une équipe, avec repli sur les logos déjà vus dans les matchs
function logoOf(team) {
  const l = team?.logo || team?.logos?.[0]?.href || "";
  if (l) return l;
  return TEAM_LOGOS[team?.displayName] || "";
}

function parseEvent(ev) {
  const comp = (ev.competitions || [])[0] || {};
  const cs = (comp.competitors || []).map(c => {
    const logo = logoOf(c.team);
    if (c.team?.displayName && logo) TEAM_LOGOS[c.team.displayName] = logo;
    return {
      name: c.team?.displayName || c.athlete?.displayName || c.displayName || "",
      score: c.score ?? "",
      logo
    };
  });
  const t = ev.status?.type || {};
  return {
    id: ev.id,
    name: ev.name || "",
    date: new Date(ev.date),
    cs,
    state: t.state || "",
    detail: t.shortDetail || t.detail || "",
    stype: ev.season?.type ?? null // 1 = présaison, 2 = saison régulière, 3 = séries
  };
}

async function loadDay(path, d) {
  const j = await getJSON(`${SCORES}${path}/scoreboard?dates=${ymd(d)}`);
  return j.events || [];
}

async function loadEvents(league, from, to) {
  const path = LEAGUES[league].path;
  let raw;
  try {
    const j = await getJSON(`${SCORES}${path}/scoreboard?dates=${ymd(from)}-${ymd(to)}`);
    raw = j.events || [];
  } catch (e) {
    // Repli : une requête par jour
    const days = [];
    for (let d = new Date(from); d <= to; d = addDays(d, 1)) days.push(new Date(d));
    const results = await Promise.allSettled(days.map(d => loadDay(path, d)));
    raw = results.filter(r => r.status === "fulfilled").flatMap(r => r.value);
    if (!raw.length && results.length && results.every(r => r.status === "rejected")) throw e;
  }
  const seen = new Set();
  const unique = raw.filter(ev => (seen.has(ev.id) ? false : seen.add(ev.id)));
  const evs = unique.map(parseEvent).sort((a, b) => a.date - b.date);
  if (evs.some(e => e.state === "in")) liveNow = true;
  return evs;
}

// Classement : conférences, équipes triées par rang. Mis en cache 3 heures.
let standingsCache = {};
async function getStandings(league) {
  const c = standingsCache[league];
  if (c && Date.now() - c.t < STANDINGS_TTL) return c.data;
  const j = await getJSON(`${STANDINGS}${LEAGUES[league].path}/standings`);
  const groups = (j.children || []).map(g => {
    const raw = (g.standings?.entries || []).map(en => {
      const st = Object.fromEntries((en.stats || []).map(s => [s.name, s.displayValue]));
      const ps = parseInt(st.playoffSeed, 10);
      const wp = parseFloat(st.winPercent ?? st.winPct ?? "");
      const w = parseFloat(st.wins ?? "");
      return {
        name: en.team?.displayName || en.athlete?.displayName || "?",
        logo: logoOf(en.team),
        st,
        ps: Number.isFinite(ps) ? ps : null,
        score: Number.isFinite(wp) ? wp : (Number.isFinite(w) ? w : 0)
      };
    });
    raw.sort((a, b) => {
      if (a.ps !== null && b.ps !== null) return a.ps - b.ps;
      return b.score - a.score;
    });
    const entries = raw.map((en, i) => ({ ...en, seed: en.ps ?? i + 1 }));
    return { name: g.name || "Classement", entries };
  }).filter(g => g.entries.length);
  standingsCache[league] = { data: groups, t: Date.now() };
  return groups;
}

function confLetter(name) {
  const s = String(name).toLowerCase();
  // « western » contient « est » : on teste d'abord l'Ouest
  if (s.includes("west") || s.includes("ouest")) return "O";
  if (s.includes("east") || /\best\b/.test(s)) return "E";
  return "";
}

async function loadRanks(league) {
  const map = new Map();
  const top = new Set();
  for (const g of await getStandings(league)) {
    const conf = confLetter(g.name);
    for (const en of g.entries) {
      map.set(en.name, { seed: en.seed, conf });
      if (en.seed <= 6) top.add(en.name);
    }
  }
  return { map, top };
}

// Nom sur une ligne, rang en dessous, ex. « (1er E) »
function teamCell(name, win = false, style = "") {
  const r = RANKS.get(name);
  const rank = r ? `(${r.seed}${r.seed === 1 ? "er" : "e"}${r.conf ? " " + r.conf : ""})` : "";
  return `<div class="nm2${win ? " win" : ""}"><div class="tn"${style ? ` style="${style}"` : ""}>${esc(name)}</div>${rank ? `<div class="rk">${esc(rank)}</div>` : ""}</div>`;
}

function isFav(text, league) {
  const t = String(text).toLowerCase();
  return (favs[league] || []).some(f => t.includes(f.toLowerCase()));
}

function matchHTML(e) {
  const when = e.date.toLocaleString("fr-FR", {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  const id = `data-id="${esc(e.id)}"`;

  // Événement sans deux équipes (ex. course F1) : affichage simple
  if (e.cs.length !== 2) {
    const status = e.state === "pre" ? when : (esc(e.detail) || when);
    return `<div class="match" ${id}>${esc(e.name)}<div class="meta">${status}</div></div>`;
  }

  const [a, b] = e.cs;
  const pre = e.state === "pre";
  const aN = Number(a.score), bN = Number(b.score);
  const finished = e.state === "post" && Number.isFinite(aN) && Number.isFinite(bN);
  // Match terminé : le gagnant est en gras. Match en cours : les deux scores sont en gras.
  const aW = finished ? aN > bN : e.state === "in";
  const bW = finished ? bN > aN : e.state === "in";
  const mid = pre ? "vs" : `<span class="sc${aW ? " w" : ""}">${esc(a.score)}</span> - <span class="sc${bW ? " w" : ""}">${esc(b.score)}</span>`;
  const live = e.state === "in" ? '<span class="live">EN DIRECT</span>' : "";
  const status = pre ? when : (esc(e.detail) || when);
  const side = t => `<div class="side">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ""}</div>`;

  return `<div class="match" ${id}>
    <div class="row">${side(a)}<div class="mid">${mid}</div>${side(b)}</div>
    <div class="row">${teamCell(a.name, aW && finished)}<div class="mid"></div>${teamCell(b.name, bW && finished)}</div>
    <div class="meta">${live}${status}</div>
  </div>`;
}

function listCard(title, evs, emptyMsg) {
  const body = evs.length
    ? evs.map(e => matchHTML(e)).join("")
    : `<p class="empty">${esc(emptyMsg)}</p>`;
  return `<section class="card"><h2>${esc(title)}</h2>${body}</section>`;
}

let teamsCache = {};
async function loadTeams(league) {
  if (teamsCache[league]) return teamsCache[league];
  let names = [];
  try {
    const j = await getJSON(`${SCORES}${LEAGUES[league].path}/teams`);
    names = (j.sports?.[0]?.leagues?.[0]?.teams || []).map(t => t.team?.displayName);
  } catch (e) {}
  if (!names.filter(Boolean).length) {
    for (const g of await getStandings(league)) for (const en of g.entries) names.push(en.name);
  }
  const list = [...new Set(names.filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
  teamsCache[league] = list;
  return list;
}

function favsCard(league, teams) {
  const items = favs[league] || [];
  const rows = items.map((n, i) =>
    `<li><span>${esc(n)}</span><button class="del" data-i="${i}" aria-label="Retirer">×</button></li>`
  ).join("");
  const picker = teams && teams.length
    ? `<select id="favInput"><option value="">Choisir une équipe…</option>${teams.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select>`
    : `<input id="favInput" autocomplete="off" placeholder="${esc(LEAGUES[league].ph)}">`;
  return `<section class="card">
    <h2>Mes favoris</h2>
    <form id="addForm">
      ${picker}
      <button class="add" type="submit">Ajouter</button>
    </form>
    <ul>${rows}</ul>
    ${items.length ? "" : `<p class="empty">Aucun favori en ${esc(league)} pour le moment.</p>`}
  </section>`;
}

async function standingsHTML(league) {
  const groups = await getStandings(league);
  const legend = `<p class="legend"><span class="dot direct"></span>Playoffs directs (1 à 6)<span class="dot playin"></span>Play-in (7 à 10)</p>`;
  let out = legend;
  for (const g of groups) {
    const rows = g.entries.map(en => {
      const cls = en.seed <= 6 ? "direct" : en.seed <= 10 ? "playin" : "";
      const logo = en.logo ? `<img class="logo" src="${esc(en.logo)}" alt="">` : "";
      const record = en.st.wins !== undefined ? `${esc(en.st.wins)}V ${esc(en.st.losses ?? "")}D` : "";
      return `<li class="st ${cls}"><span class="rank">${esc(en.seed)}</span><span class="nm">${logo}<span class="tn">${esc(en.name)}</span></span><span class="meta">${record}</span></li>`;
    }).join("");
    const open = openConfs.has(g.name) ? " open" : "";
    out += `<details class="conf" data-conf="${esc(g.name)}"${open}><summary>${esc(g.name)}</summary><ul>${rows}</ul></details>`;
  }
  return groups.length
    ? `<section class="card">${out}</section>`
    : `<section class="card"><p class="empty">Classement indisponible pour ce championnat.</p></section>`;
}

// Luminosité d'une couleur hexadécimale (0 à 1)
function brightness(hex) {
  const h = String(hex).replace("#", "");
  if (h.length !== 6) return 1;
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
}

// Couleur du texte : la couleur de l'équipe, sauf si elle est trop sombre pour le mode nuit
function textColor(hex) {
  if (!hex) return "";
  return brightness(hex) < 0.3 ? "var(--text)" : `#${hex.replace("#", "")}`;
}

// Détail d'un match : score, quart-temps, tous les joueurs
async function detailHTML(id, league) {
  const j = await getJSON(`${SCORES}${LEAGUES[league].path}/summary?event=${encodeURIComponent(id)}`);
  const comp = j.header?.competitions?.[0] || {};
  const comps = comp.competitors || [];
  const st = comp.status?.type || {};
  if (st.state === "in") liveNow = true;

  // Couleurs par équipe : depuis l'en-tête, puis depuis la feuille de match
  // Deux couleurs par équipe : principale (haut de la barre) et secondaire (bas)
  const pairByName = {};
  const remember = team => {
    if (team?.displayName && team?.color) {
      pairByName[team.displayName] = { p: team.color, s: team.alternateColor || team.color };
    }
  };
  for (const t of (j.boxscore?.teams || [])) remember(t.team);
  for (const c of comps) remember(c.team);
  const pairOf = team => pairByName[team?.displayName] || { p: team?.color || "", s: team?.alternateColor || team?.color || "" };
  const colorOf = team => pairOf(team).p;

  const [a = {}, b = {}] = comps;
  const logo = c => {
    const l = logoOf(c.team) || logoOf((j.boxscore?.teams || []).find(t => t.team?.displayName === c.team?.displayName)?.team);
    return l ? `<img src="${esc(l)}" alt="">` : "";
  };
  const shortName = c => c.team?.shortDisplayName || c.team?.displayName || "";
  const aFinal = Number(a.score), bFinal = Number(b.score);
  const aWin = Number.isFinite(aFinal) && Number.isFinite(bFinal) && aFinal > bFinal;
  const bWin = Number.isFinite(aFinal) && Number.isFinite(bFinal) && bFinal > aFinal;

  // En-tête : logos et score sur une ligne, noms et classements dessous
  const head = comps.length === 2
    ? `<div class="row">
         <div class="side">${logo(a)}</div>
         <div class="mid"><b class="big">${esc(a.score)} - ${esc(b.score)}</b></div>
         <div class="side">${logo(b)}</div>
       </div>
       <div class="row">
         ${teamCell(a.team?.displayName || "", aWin, `color:${textColor(colorOf(a.team))}`)}
         <div class="mid"></div>
         ${teamCell(b.team?.displayName || "", bWin, `color:${textColor(colorOf(b.team))}`)}
       </div>`
    : `<h2>${esc(j.header?.name || "")}</h2>`;

  // Quart-temps : le gagnant de chaque période est en gras
  const periods = Math.max(4, ...comps.map(c => (c.linescores || []).length));
  const heads = Array.from({length: periods}, (_, i) => i < 4 ? `T${i + 1}` : "Prol.");
  const valsOf = c => heads.map((_, i) => {
    const v = (c.linescores || [])[i];
    if (!v) return null;
    const n = Number(v.value ?? v.displayValue);
    return Number.isFinite(n) ? n : null;
  });
  const va = valsOf(a), vb = valsOf(b);
  const cellFor = (mine, other, i) => {
    const v = mine[i];
    if (v === null) return "–";
    return other[i] !== null && v > other[i] ? `<b>${v}</b>` : `${v}`;
  };
  const qtRow = (c, mine, other, win) =>
    `<tr><th class="${win ? "win" : ""}" style="color:${textColor(colorOf(c.team))}">${logo(c)}${esc(shortName(c))}</th>${heads.map((_, i) => `<td>${cellFor(mine, other, i)}</td>`).join("")}<td class="${win ? "win" : ""}">${esc(c.score ?? "")}</td></tr>`;
  const qt = comps.length === 2
    ? `<table class="qt"><tr><th></th>${heads.map(h => `<th>${h}</th>`).join("")}<th>Final</th></tr>${qtRow(a, va, vb, aWin)}${qtRow(b, vb, va, bWin)}</table>`
    : "";

  // Joueurs : un seul tableau, trié par PTS, REB, AST, STL, BLK, +/-
  const SORT_KEYS = ["PTS", "REB", "AST", "STL", "BLK", "+/-"];
  const cols = [["PTS", "PTS"], ["REB", "REB"], ["AST", "AST"], ["STL", "Steals"], ["BLK", "Contres"], ["+/-", "+/-"]];
  const players = [];
  for (const team of (j.boxscore?.players || [])) {
    const block = team.statistics?.[0];
    const names = block?.names || [];
    const pair = pairOf(team.team);
    for (const x of (block?.athletes || [])) {
      if (!(x.stats || []).length) continue;
      const stats = x.stats;
      const get = k => { const i = names.indexOf(k); return i >= 0 ? (stats[i] ?? "") : ""; };
      players.push({ name: x.athlete?.displayName || x.athlete?.shortName || "", color: pair.p, alt: pair.s, get });
    }
  }
  const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : -Infinity; };
  players.sort((x, y) => {
    for (const k of SORT_KEYS) {
      const p = num(x.get(k)), q = num(y.get(k));
      if (p !== q) return q > p ? 1 : -1;
    }
    return 0;
  });
  const playerRows = players.map(p => {
    const hex = c => String(c).replace("#", "");
    const bar = p.color
      ? `<span class="bar" style="background:linear-gradient(#${hex(p.color)} 50%,#${hex(p.alt || p.color)} 50%)"></span>`
      : "";
    const nameColor = p.color ? `color:${textColor(p.color)}` : "";
    const cells = cols.map(([k]) => `<td>${esc(p.get(k))}</td>`).join("");
    return `<tr><td class="pn" style="${nameColor}">${bar}${esc(p.name)}</td>${cells}</tr>`;
  }).join("");
  const playersHTML = players.length
    ? `<table class="pl"><tr><th>Joueur</th>${cols.map(([, label]) => `<th>${esc(label)}</th>`).join("")}</tr>${playerRows}</table>`
    : `<p class="empty">Statistiques joueurs indisponibles pour ce match.</p>`;

  return `<section class="card">
    <button class="back" data-back>← Retour</button>
    ${head}
    <p class="meta" style="text-align:center">${st.state === "in" ? '<span class="live">EN DIRECT</span>' : ""}${esc(st.shortDetail || st.detail || "")}</p>
    ${qt}
    <h3 class="sub-h">Joueurs</h3>
    ${playersHTML}
  </section>`;
}

function renderNav() {
  document.getElementById("leagues").innerHTML = Object.keys(LEAGUES).map(l =>
    `<button data-league="${esc(l)}" class="${l === state.league ? "on" : ""}">${esc(l)}</button>`).join("");
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button data-tab="${t.key}" class="${!state.detail && t.key === state.tab ? "on" : ""}">${esc(t.label)}</button>`).join("");
}

function dayTitle(d) {
  const s = d.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => render({silent: true}), liveNow ? REFRESH_LIVE : REFRESH_IDLE);
}

async function render(opts = {}) {
  const my = ++token;
  liveNow = false;
  renderNav();
  const L = state.league;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const app = document.getElementById("app");
  if (!opts.silent) app.innerHTML = '<p class="empty">Chargement…</p>';

  try {
    let html = "";
    if (state.detail) {
      html = await detailHTML(state.detail, L);
    } else {
      try {
        const r = await loadRanks(L);
        RANKS = r.map; TOP = r.top;
      } catch (e) {
        RANKS = new Map(); TOP = new Set();
      }

      if (state.tab === "mine") {
        // 3 prochains jours, séparés par jour : favoris, puis grosses affiches
        const evs = await loadEvents(L, today, addDays(today, 2));
        const isMine = e => e.cs.some(c => isFav(c.name, L)) || isFav(e.name, L);
        const isGrosse = e => e.cs.length === 2 && e.cs.every(c => TOP.has(c.name));
        const days = {};
        for (const e of evs) {
          const k = e.date.toDateString();
          (days[k] = days[k] || { date: e.date, evs: [] }).evs.push(e);
        }
        for (const k of Object.keys(days)) {
          const { date, evs: dayEvs } = days[k];
          const favM = dayEvs.filter(isMine);
          const grosse = dayEvs.filter(e => !isMine(e) && isGrosse(e));
          if (!favM.length && !grosse.length) continue;
          html += `<section class="card"><h2>${esc(dayTitle(date))}</h2>
            <h3 class="sub-h">Mes favoris</h3>${favM.length ? favM.map(matchHTML).join("") : '<p class="empty">Aucun match de vos favoris.</p>'}
            <h3 class="sub-h">Grosses affiches</h3>${grosse.length ? grosse.map(matchHTML).join("") : '<p class="empty">Aucune grosse affiche.</p>'}
          </section>`;
        }
        if (!html) html = `<section class="card"><p class="empty">Aucun match de vos favoris ni grosse affiche dans les 3 prochains jours.</p></section>`;
      } else if (state.tab === "cal") {
        const evs = await loadEvents(L, today, addDays(today, 7));
        html = listCard("Calendrier : 7 prochains jours", evs, "Rien de prévu dans les 7 prochains jours.");
      } else if (state.tab === "results") {
        const evs = await loadEvents(L, seasonStart(LEAGUES[L].startMonth), addDays(today, -1));
        const played = evs.filter(e => e.state === "post" && e.stype !== 1).reverse();
        let teams = [];
        try { teams = await loadTeams(L); } catch (e) { teams = []; }
        const shown = played.filter(e => !state.teamFilter || e.cs.some(c => c.name === state.teamFilter));
        const select = `<select class="filter" id="teamFilter"><option value="">Toutes les équipes</option>${teams.map(t => `<option value="${esc(t)}"${t === state.teamFilter ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
        html = `<section class="card"><h2>Résultats : saison en cours</h2>${select}${shown.length ? shown.map(matchHTML).join("") : '<p class="empty">Aucun résultat pour cette sélection.</p>'}</section>`;
      } else if (state.tab === "favs") {
        let teams = [];
        try { teams = await loadTeams(L); } catch (e) { teams = []; }
        html = favsCard(L, teams);
      } else {
        html = await standingsHTML(L);
      }
    }
    if (my !== token) return;
    app.innerHTML = html;
  } catch (err) {
    if (my !== token) return;
    app.innerHTML = `<section class="card"><p class="empty">Données indisponibles pour ${esc(L)} : ${esc(err.message)}. La source peut être momentanément inaccessible. Réessayez plus tard.</p></section>`;
  }
  if (my === token) scheduleRefresh();
}

// Gestion des clics, formulaires et filtres : écouteurs posés une seule fois
const appEl = document.getElementById("app");
appEl.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) { state.detail = null; render(); return; }
  const m = e.target.closest(".match[data-id]");
  if (m) { state.detail = m.dataset.id; render(); return; }
  const d = e.target.closest(".del");
  if (d) {
    favs[state.league].splice(+d.dataset.i, 1);
    saveFavs();
    render();
  }
});
appEl.addEventListener("submit", e => {
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const input = document.getElementById("favInput");
  const v = (input.value || "").trim();
  if (!v) return;
  favs[state.league] = favs[state.league] || [];
  if (!favs[state.league].includes(v)) favs[state.league].push(v);
  saveFavs();
  render();
});
appEl.addEventListener("change", e => {
  if (e.target.id !== "teamFilter") return;
  state.teamFilter = e.target.value;
  render({silent: true});
});
// Mémorise les conférences dépliées pour les garder après un rafraîchissement
appEl.addEventListener("toggle", e => {
  const d = e.target;
  if (!d.matches || !d.matches("details.conf")) return;
  const name = d.dataset.conf;
  if (d.open) openConfs.add(name); else openConfs.delete(name);
}, true);

document.getElementById("leagues").addEventListener("click", e => {
  const b = e.target.closest("button[data-league]");
  if (b) { state.league = b.dataset.league; state.detail = null; state.teamFilter = ""; render(); }
});
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) { state.tab = b.dataset.tab; state.detail = null; render(); }
});

render();
</script>
</body>
</html>
