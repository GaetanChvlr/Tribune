name: Notifications Tribune

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes : détection des matchs terminés
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Envoyer les scores finaux
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/notify.mjs finals

      - name: Enregistrer l'état des notifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour de l'état des notifications"
            git pull --rebase -q origin main
            git push
          fi
