name: Calcul MVP

on:
  schedule:
    - cron: "30 9 * * *"   # chaque jour à 9h30 UTC
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

jobs:
  mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calculer les classements MVP
        run: node scripts/build-mvp.mjs

      - name: Enregistrer le fichier mvp.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mvp.json
          git diff --cached --quiet || (git commit -m "Mise à jour du classement MVP" && git push)
