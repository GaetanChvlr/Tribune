name: Sonde ESPN (temporaire)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester les saisons
        run: |
          B=https://site.api.espn.com/apis/site/v2/sports/basketball/nba
          OUT=data/probe-espn.txt
          : > $OUT
          for y in $(seq 1946 3 1995) 1996 1998 2000 2002; do
            total=0; first=""; dates=""
            for md in 1101 1115 1201 1215 0101 0115 0201 0215 0301 0315 0401 0415 0501 0515 0601; do
              d=$([ $md -ge 1000 ] && echo $y || echo $((y+1)))
              key="${d}${md:0:4}"
              key="${d}${md}"
              n=$(curl -s -m 30 -o /tmp/sb.json -w "%{http_code}" "$B/scoreboard?dates=$key")
              c=$(node -e 'try{const j=JSON.parse(require("fs").readFileSync("/tmp/sb.json","utf8"));console.log((j.events||[]).length)}catch(e){console.log(0)}')
              total=$((total+c))
              if [ -z "$first" ] && [ "$c" -gt 0 ]; then first=$(node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/sb.json","utf8"));console.log(j.events[0].id+" "+j.events[0].season?.type)'); fi
            done
            info="-"
            if [ -n "$first" ]; then
              eid=${first%% *}
              sm=$(curl -s -m 30 -o /tmp/sm.json -w "%{http_code}" "$B/summary?event=$eid")
              info="summary $sm: $(node -e 'try{const j=JSON.parse(require("fs").readFileSync("/tmp/sm.json","utf8"));const t=j.boxscore?.players?.[0]?.statistics?.[0];console.log("colonnes="+(t?.names||[]).join(","))}catch(e){console.log("err")}')"
            fi
            echo "saison $y-$((y+1)) : matchs trouvés sur 15 dates = $total ; $info" >> $OUT
          done
          cat $OUT
      - name: Enregistrer le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe-espn.txt
          git commit -m "Sonde ESPN" && git push || true
