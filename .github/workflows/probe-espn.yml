name: Sonde ESPN (temporaire)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic
        run: node scripts/probe.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe-espn.txt
          git commit -m "Sonde ESPN" && git pull --rebase -q origin main && git push -q origin HEAD:main || true
