name: Saisons passées

# Construit les données des saisons passées (une par job, en parallèle), puis le classement All Time.
# Chaque dimanche à 3h (heure de Paris en hiver : 2h UTC), et à la main depuis l'onglet Actions après une correction.

on:
  schedule:
    - cron: "0 2 * * 0"   # dimanche 2h UTC (3h à Paris en hiver, 4h en été)
  workflow_dispatch:
    inputs:
      annees:
        description: 'Saisons à reconstruire, au format JSON (vide = toutes)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  saison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        annee: ${{ fromJSON(inputs.annees || '[1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer la saison ${{ matrix.annee }}
        run: node scripts/build-games.mjs ${{ matrix.annee }}

      - name: Enregistrer la saison ${{ matrix.annee }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Saison ${{ matrix.annee }}-$(( (${{ matrix.annee }} + 1) % 100 ))"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done

  alltime:
    needs: saison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calculer le classement All Time
        run: node scripts/build-alltime.mjs

      - name: Enregistrer le classement All Time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Classement All Time"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
